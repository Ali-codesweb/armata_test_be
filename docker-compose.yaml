
services:
  armada_db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: armada_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ArmadaPassword
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'ArmadaPassword' -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "1433:1433"
